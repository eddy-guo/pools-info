name: Validate application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pools_test
          POSTGRES_PASSWORD: pools_test
          POSTGRES_DB: pools_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pools_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:db
        env:
          TEST_DATABASE_URL: postgresql://pools_test:pools_test@127.0.0.1:5432/pools_test
      - run: docker build -f apps/indexer/Dockerfile -t pools-indexer:test .
      - run: docker run --rm --network host -e DATABASE_URL=postgresql://pools_test:pools_test@127.0.0.1:5432/pools_test pools-indexer:test node --import tsx src/main.ts migrate
      - run: docker run --rm --network host -e DATABASE_URL=postgresql://pools_test:pools_test@127.0.0.1:5432/pools_test pools-indexer:test node --import tsx src/main.ts status
      - run: docker build -f apps/api/Dockerfile -t pools-api:test .
      - name: Verify read API container
        run: |
          docker run --detach --name pools-api-test --network host -e PORT=3102 -e DATABASE_URL=postgresql://pools_test:pools_test@127.0.0.1:5432/pools_test pools-api:test
          trap 'docker rm -f pools-api-test' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:3102/ready
          curl --fail http://127.0.0.1:3102/v1/status
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
